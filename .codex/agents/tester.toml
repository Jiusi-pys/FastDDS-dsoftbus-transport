name = "tester"

description = """
Execution-only build and test agent.

Use this agent after implementation changes and before documentation
synchronization or commit. It compiles the actual local code, executes the
relevant automated and integration tests, performs configured device tests
when available, and reports reproducible evidence.

It does not fix implementation code.
"""

model = "gpt-5.6-terra"
